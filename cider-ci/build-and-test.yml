include:
  - cider-ci/environment_variables.yml
  - cider-ci/install-missing-libs.yml
  - cider-ci/toolchain.yml
git_options:
  submodules:
    # vendor only (Temurin 21 JDK + assets). Skip node_modules submodule; use npm install.
    include_match: ^vendor
trial_attachments:
  screenshots:
    include_match: 'tmp\/.+\.png$'
    content_type: image/png
  logs:
    include_match: 'logs\/.+\.log$'
    content_type: text/plain
traits:
  JDK: true
  Leiningen: true
  nodejs: true
  # Desktop/wine/xorg libs are installed by install-missing-libs (not via Cider traits).
scripts:
  build-stylesheets:
    body: |
      set -euo pipefail
      ./bin/with-node22 ./bin/build-stylesheets-prod
    start_when:
      install-npm-packages has passed:
        script_key: install-npm-packages
  build-electron-front:
    body: |
      set -euo pipefail
      ./bin/with-java21 lein do \
        externs electron-front-prod app/prod/js/front_externs.js, \
        cljsbuild once electron-front-prod
      # Advanced build only needs front.js — drop Closure work dirs / maps
      # (must match bin/build-electron-front-prod; validate-build-artifacts enforces).
      rm -rf app/prod/js/out_front app/prod/js/front.js.map
    start_when:
      install-npm-packages has passed:
        script_key: install-npm-packages
      java toolchain is ready:
        script_key: check-java-toolchain
  build-electron-main:
    body: |
      set -euo pipefail
      ./bin/with-java21 lein do \
        externs electron-main-prod app/prod/js/main_externs.js, \
        cljsbuild once electron-main-prod
      # Advanced build only needs main.js — drop Closure work dirs / maps
      # (must match bin/build-electron-main-prod; validate-build-artifacts enforces).
      rm -rf app/prod/js/out_main app/prod/js/main.js.map
    start_when:
      install-npm-packages has passed:
        script_key: install-npm-packages
      java toolchain is ready:
        script_key: check-java-toolchain
  build-jvm-main:
    body: |
      set -euo pipefail
      ./bin/with-java21 lein uberjar
    start_when:
      java toolchain is ready:
        script_key: check-java-toolchain
  build-components-done:
    # just a meta script to model dependencies easier
    body: exit 0
    start_when:
      build jvm server has passed:
        script_key: build-jvm-main
      build electron-front has passed:
        script_key: build-electron-front
      build electron-main has passed:
        script_key: build-electron-main
      stylesheets have been built:
        script_key: build-stylesheets
  build-mac-os:
    body: |
      set -euo pipefail
      ./bin/with-node22 ./bin/build-mac-os
      mkdir -p target/dist
      ./bin/zip-tree target/dist/Madek-Exporter_Mac-OS-x64.zip target/packages/madek-exporter-darwin-x64
    start_when:
      missing libs installed:
        script_key: install-missing-libs
      build-components has passed:
        script_key: build-components-done
  build-mac-os-arm64:
    body: |
      set -euo pipefail
      ./bin/with-node22 ./bin/build-mac-os-arm64
      mkdir -p target/dist
      ./bin/zip-tree target/dist/Madek-Exporter_Mac-OS-ARM64.zip target/packages/madek-exporter-darwin-arm64
    start_when:
      missing libs installed:
        script_key: install-missing-libs
      build-components has passed:
        script_key: build-components-done
  build-windows:
    body: |
      set -euo pipefail
      ./bin/with-node22 ./bin/build-win
      mkdir -p target/dist
      ./bin/zip-tree target/dist/Madek-Exporter_Windows.zip target/packages/madek-exporter-win32-x64
    start_when:
      missing libs installed:
        script_key: install-missing-libs
      build-components has passed:
        script_key: build-components-done
  build-linux:
    body: |
      set -euo pipefail
      ./bin/with-node22 ./bin/build-linux
      mkdir -p target/dist
      ./bin/build-linux-deb \
        target/packages/madek-exporter-linux-x64 \
        amd64 \
        target/dist/Madek-Exporter_Linux-x64.deb
      ./bin/pack-linux-deb-zip target/dist/Madek-Exporter_Linux-x64.deb
    start_when:
      missing libs installed:
        script_key: install-missing-libs
      build-components has passed:
        script_key: build-components-done
  build-linux-arm64:
    body: |
      set -euo pipefail
      ./bin/with-node22 ./bin/build-linux-arm64
      mkdir -p target/dist
      ./bin/build-linux-deb \
        target/packages/madek-exporter-linux-arm64 \
        arm64 \
        target/dist/Madek-Exporter_Linux-ARM64.deb
      ./bin/pack-linux-deb-zip target/dist/Madek-Exporter_Linux-ARM64.deb
    start_when:
      missing libs installed:
        script_key: install-missing-libs
      build-components has passed:
        script_key: build-components-done
  validate-build-artifacts:
    body: |
      set -euo pipefail
      ./bin/validate-build-artifacts
    start_when:
      build-linux has passed:
        script_key: build-linux
      build-linux-arm64 has passed:
        script_key: build-linux-arm64
      build-mac-os has passed:
        script_key: build-mac-os
      build-mac-os-arm64 has passed:
        script_key: build-mac-os-arm64
      build-windows has passed:
        script_key: build-windows
  # Same fake-server + JVM checks as the `tests` job (`cider-ci/test-login-api.yml`);
  # keep them in the build trial so packaged apps are still exercised against the stub API.
  fake-madek-api-tests:
    timeout: 20 Minutes
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      LEIN=lein ./bin/with-java21 ./bin/with-node22 ./bin/test-login
    start_when:
      node toolchain is ready:
        script_key: check-node-toolchain
      java toolchain is ready:
        script_key: check-java-toolchain
      artifacts are valid:
        script_key: validate-build-artifacts
  smoke-main-process:
    body: |
      set -euo pipefail
      mkdir -p logs
      if [[ -f .tools/sysroot-env.sh ]]; then
        # shellcheck disable=SC1091
        source .tools/sysroot-env.sh
      fi
      SMOKE_LOG=logs/smoke-main-process.log xvfb-run -a ./bin/smoke-run ./target/packages/madek-exporter-linux-x64/madek-exporter
    start_when:
      missing libs installed:
        script_key: install-missing-libs
      artifacts are valid:
        script_key: validate-build-artifacts
  test:
    start_when:
      smoke has passed:
        script_key: smoke-main-process
      fake Madek API tests have passed:
        script_key: fake-madek-api-tests
    body: |
      #!/usr/bin/env bash
      set -eux
      mkdir -p logs
      ./bin/validate-build-artifacts
