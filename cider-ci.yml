jobs:
  check-releases-file-is-up-to-date:
    name: Check if app/prod/releases.json is up to date
    run_when:
      on any branch:
        type: branch
        include_match: ^.*$
    context:
      tasks:
        build:
          # No desktop/wine traits. Ruby via asdf (exclusive_executor_resource in bundle-script).
          traits:
            asdf: true
            asdf-ruby: true
          scripts:
            include:
              - cider-ci/bundle-script.yml
            check:
              start_when:
                bundle has passed:
                  script_key: bundle
              body: |
                #!/usr/bin/env bash
                set -euo pipefail
                ./bin/env/ruby-setup
                bundle exec ./bin/update-releases
                git diff --stat --exit-code -- app/prod/releases.json

  security-audit:
    name: Security audit (npm + OSV)
    run_when:
      on any branch:
        type: branch
        include_match: ^.*$
    context:
      tasks:
        scan:
          traits:
            JDK: true
            Leiningen: true
            nodejs: true
          scripts:
            scan:
              timeout: 20 Minutes
              body: |
                #!/usr/bin/env bash
                set -euo pipefail
                OSV_SCANNER_VERSION=2.4.0
                if ! command -v osv-scanner >/dev/null 2>&1; then
                  OSV_BIN_DIR="$(mktemp -d)"
                  curl -fsSL \
                    "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
                    -o "${OSV_BIN_DIR}/osv-scanner"
                  chmod +x "${OSV_BIN_DIR}/osv-scanner"
                  export PATH="${OSV_BIN_DIR}:${PATH}"
                fi
                ./bin/security-audit || {
                  rc=$?
                  if [[ "$rc" -eq 1 ]]; then
                    echo "Vulnerabilities found (non-blocking)."
                    exit 0
                  fi
                  exit "$rc"
                }

  tests:
    name: All tests
    run_when:
      on any branch:
        type: branch
        include_match: ^.*$
    context:
      tasks:
        fake-api-and-jvm:
          name: Fake Madek API auth matrix + JVM connect tests
          include:
            - cider-ci/test-login-api.yml
        playwright:
          name: End2End-Tests
          include:
            - cider-ci/test-login-e2e.yml

  build:
    name: Build the App
    depends_on: &BUILD_DEPS
      releases file is up to date:
        type: job
        job_key: check-releases-file-is-up-to-date
        states: [passed]
      security audit has passed:
        type: job
        job_key: security-audit
        states: [passed]
      all tests have passed:
        type: job
        job_key: tests
        states: [passed]
    run_when: *BUILD_DEPS
    context:
      tasks:
        build:
          include:
            - cider-ci/build-and-test.yml
          scripts:
            prepare-release-infos:
              start_when:
                build-linux has passed:
                  script_key: build-linux
                build-linux-arm64 has passed:
                  script_key: build-linux-arm64
                build-windows has passed:
                  script_key: build-windows
                build-mac-os has passed:
                  script_key: build-mac-os
                build-mac-os-arm64 has passed:
                  script_key: build-mac-os-arm64
              timeout: 10 Minutes
              body: |
                set -euo pipefail
                ./bin/prepare-release-infos
